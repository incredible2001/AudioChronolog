<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AudioChronolog{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
            background: #f0f2f5;
            color: #1a1a1a;
            min-height: 100vh;
        }

        /* ─── 顶部导航 ──────────────────────────────────── */
        .navbar {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: #fff;
            padding: 0.4rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar .brand {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .navbar .brand span { font-size: 1.1rem; }

        /* ─── 主容器 ────────────────────────────────────── */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
        }

        /* ─── 卡片 ──────────────────────────────────────── */
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            padding: 1.5rem;
            transition: box-shadow 0.2s, transform 0.15s;
        }
        .card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            transform: translateY(-1px);
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        /* ─── 按钮 ──────────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
        }
        .btn-primary {
            background: #2563eb;
            color: #fff;
        }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-success {
            background: #16a34a;
            color: #fff;
        }
        .btn-success:hover { background: #15803d; }
        .btn-secondary {
            background: #e2e8f0;
            color: #475569;
        }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-danger {
            background: #dc2626;
            color: #fff;
        }
        .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.82rem; }

        /* ─── 表单 ──────────────────────────────────────── */
        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
            color: #374151;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            transition: border-color 0.15s;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .form-group textarea { resize: vertical; min-height: 80px; }

        /* ─── 项目卡片 ──────────────────────────────────── */
        .project-card {
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .project-card .project-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.4rem;
        }
        .project-card .project-meta {
            font-size: 0.82rem;
            color: #64748b;
        }
        .project-card .project-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        /* ─── Tab 导航 ──────────────────────────────────── */
        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 1.5rem;
        }
        .tab {
            padding: 0.45rem 1rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            color: #64748b;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.15s;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
        }
        .tab:hover { color: #2563eb; }
        .tab.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
        }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* ─── 上传区 ────────────────────────────────────── */
        .upload-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafbfc;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: #2563eb;
            background: #eff6ff;
        }
        .upload-zone .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .upload-zone .text { color: #64748b; font-size: 0.9rem; }
        .upload-zone .hint { color: #94a3b8; font-size: 0.8rem; margin-top: 0.3rem; }
        .file-list { margin-top: 1rem; }
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0.8rem;
            background: #f8fafc;
            border-radius: 6px;
            margin-bottom: 0.3rem;
            font-size: 0.85rem;
        }

        /* ─── 进度区 ────────────────────────────────────── */
        .progress-area {
            margin-top: 1.5rem;
            display: none;
        }
        .progress-area.active { display: block; }
        .progress-bar-bg {
            background: #e2e8f0;
            border-radius: 8px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 0.8rem;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #3b82f6);
            border-radius: 8px;
            transition: width 0.3s ease;
            width: 0%;
        }
        .progress-log {
            background: #1e293b;
            color: #94a3b8;
            border-radius: 8px;
            padding: 1rem;
            max-height: 300px;
            overflow-y: auto;
            font-family: "Cascadia Code", "Fira Code", monospace;
            font-size: 0.82rem;
            line-height: 1.6;
        }
        .progress-log .log-info { color: #38bdf8; }
        .progress-log .log-step { color: #a78bfa; font-weight: 600; }
        .progress-log .log-success { color: #4ade80; }
        .progress-log .log-error { color: #f87171; }

        /* ─── 报告 iframe ──────────────────────────────── */
        .report-frame {
            width: 100%;
            height: calc(100vh - 200px);
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #fff;
        }

        /* ─── Modal ─────────────────────────────────────── */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #fff;
            border-radius: 16px;
            padding: 2rem;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .modal h2 { margin-bottom: 1rem; font-size: 1.2rem; }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }

        /* ─── 状态标签 ──────────────────────────────────── */
        .badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-blue { background: #dbeafe; color: #1e40af; }
        .badge-green { background: #dcfce7; color: #166534; }
        .badge-gray { background: #f1f5f9; color: #475569; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="brand"><span>🎙️</span> AudioChronolog</a>
        <div style="display:flex; align-items:center; gap:1rem;">
            <a href="/help" style="color:#94a3b8; font-size:0.82rem; text-decoration:none;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#94a3b8'">使用说明</a>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
